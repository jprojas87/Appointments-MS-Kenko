name: appointments

services:
  appointments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - appointments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  appointments-api:
    build:
      context: .
      target: runtime
    env_file: .env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      appointments-db:
        condition: service_healthy
    restart: unless-stopped

  appointments-tests:
    build:
      context: .
      target: test
    env_file: .env
    depends_on:
      appointments-db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  appointments-db-data:
